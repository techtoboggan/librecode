name: CI

on:
  pull_request:
    branches: [main]
  workflow_call: # called by release.yml as the quality gate
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck

  test-core:
    name: Test (core CLI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      # Package test script runs unit pass first (excluding mcp-integration)
      # then the integration pass — sibling mcp/ tests install sticky
      # bun mock.module shims that would break the real-transport
      # integration tests if they shared the same `bun test` invocation.
      #
      # Two env vars together make the models.dev data fully deterministic and
      # network-free, killing the recurring "no providers found" flake:
      #
      # LIBRECODE_MODELS_PATH — pin Provider.Data() to the committed fixture
      #   from process start (Flag captures process.env at module-eval, so a
      #   job-level env guarantees it's present from t=0).
      #
      # LIBRECODE_DISABLE_MODELS_FETCH — the REAL root cause of the residual
      #   flake (v0.10.7/.8/.12 all "no providers found", passed on rerun).
      #   models.ts fires a fire-and-forget `modelsDevRefresh()` at module-eval
      #   (and on a 1h interval) UNLESS this flag is set. That background fetch
      #   hits the live network and, on success, calls `Data.reset()` —
      #   clearing the memoized fixture data mid-suite and racing every test
      #   that reads providers. Pinning MODELS_PATH fixed the initial load but
      #   left this reset race running, so the flake survived. This flag skips
      #   the auto-fetch + interval entirely; Data() still reads the fixture
      #   first, so providers are present with zero network access. Verified:
      #   full core suite (2004 tests) green and offline with both set.
      - run: bun run test
        working-directory: packages/librecode
        env:
          LIBRECODE_MODELS_PATH: ${{ github.workspace }}/packages/librecode/test/tool/fixtures/models-api.json
          LIBRECODE_DISABLE_MODELS_FETCH: "1"

  test-util:
    name: Test (util)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: packages/util

  test-plugin:
    name: Test (plugin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun test
        working-directory: packages/plugin

  test-app:
    name: Test (app unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - run: bun run test:unit
        working-directory: packages/app

  lint:
    name: Lint & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - run: bun install --frozen-lockfile
      - name: Prettier
        run: bunx prettier --check .
      - name: Biome (warnings only, errors fail)
        run: bunx biome lint .

  # A06 (Vulnerable and Outdated Components) — scan the Rust/Tauri dep graph
  # when Cargo.lock / Cargo.toml changes on this PR. Advisories landing upstream
  # unrelated to the PR's changes are handled by the scheduled workflow in
  # `.github/workflows/security-audit.yml`, which opens an issue so we can
  # respond on our own cadence instead of breaking every release that lands
  # between the advisory publish time and our bump.
  rust-audit:
    name: Rust audit (cargo-audit, PR-only)
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Check whether this PR touches Cargo metadata
        id: cargo-changed
        run: |
          if git fetch --depth=1 origin "${{ github.base_ref }}" 2>/dev/null; then
            if git diff --name-only "origin/${{ github.base_ref }}" HEAD -- \
                 'packages/desktop/src-tauri/Cargo.lock' \
                 'packages/desktop/src-tauri/Cargo.toml' \
                 'packages/desktop/src-tauri/audit.toml' | grep -q .; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: dtolnay/rust-toolchain@stable
        if: steps.cargo-changed.outputs.changed == 'true'
      - name: Install cargo-audit
        if: steps.cargo-changed.outputs.changed == 'true'
        run: cargo install cargo-audit --locked
      - name: Audit Tauri Rust deps
        # audit.toml in the manifest dir declares accepted-risk advisories
        # (unmaintained GTK3 bindings etc). Fails on any un-ignored advisory.
        if: steps.cargo-changed.outputs.changed == 'true'
        run: cargo audit
        working-directory: packages/desktop/src-tauri
