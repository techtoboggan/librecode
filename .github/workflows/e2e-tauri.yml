name: E2E (Tauri — real webview)
# Phase 54 — REAL tauri-mode E2E, running as its OWN workflow.
#
# This is DELIBERATELY NOT part of e2e.yml and NOT in release.yml's `needs`
# chain. It launches the actual app (`bun tauri dev --features e2e-testing`)
# under xvfb on a headless runner and drives the native WebKitGTK webview via
# tauri-plugin-playwright's socket bridge. Because it does a full cold cargo
# build of the desktop crate (~30 min), gating releases on it would slow every
# release. Instead it fires independently on the same tag push and reports
# results in parallel as an ADVISORY signal.
#
# The whole job is best-effort while the real-app launch + socket dance is
# being hardened: a failure here surfaces in the Actions UI but blocks
# nothing. Flip the `e2e-tauri` job into release.yml's `needs` (and drop the
# advisory framing) once it's reliably green across a few releases.
#
# Window-leak safety: xvfb-run gives the spawned Tauri app a PRIVATE headless
# display, so a real native window can never leak onto a developer's desktop
# (the failure mode that prompted this isolation). CI runners have no real
# display anyway, but xvfb-run makes the isolation explicit and lets the same
# command run locally without surprises.
#
# Needs the REAL CLI sidecar (the app spawns it as its backend) — a stub
# won't do here, unlike the compile-check in e2e.yml.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: "Git ref to check out (default: current)"

jobs:
  tauri-real-linux:
    name: E2E — tauri mode (real webview)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: e2e-tauri-cargo-${{ runner.os }}-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: e2e-tauri-cargo-${{ runner.os }}-
      - run: bun install --frozen-lockfile

      # Playwright still needs its driver browser even in tauri mode (the
      # library launches it alongside the socket bridge). Missing this was the
      # instant "Executable doesn't exist … chrome-headless-shell" failure that
      # kept this workflow red from day one — it only ever worked locally
      # because dev machines already had Chromium from browser-mode runs.
      - name: Install Playwright Chromium browser
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      - name: Build real CLI sidecar
        run: bun run script/build.ts --single
        working-directory: packages/librecode
      - name: Stage CLI sidecar for Tauri externalBin
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          # build.ts --single emits dist/librecode-linux-x64/bin/librecode
          # (same path desktop.yml's cli_src uses). Resolve it robustly in
          # case the dir name varies, then stage where externalBin expects.
          src="packages/librecode/dist/librecode-linux-x64/bin/librecode"
          if [ ! -f "$src" ]; then
            src=$(find packages/librecode/dist -path '*/bin/librecode' -type f | head -1)
          fi
          echo "sidecar src: $src"
          test -f "$src" || { echo "::error::CLI sidecar binary not found under packages/librecode/dist"; ls -R packages/librecode/dist | head -40; exit 1; }
          cp "$src" packages/desktop/src-tauri/sidecars/librecode-cli-x86_64-unknown-linux-gnu
          chmod +x packages/desktop/src-tauri/sidecars/librecode-cli-x86_64-unknown-linux-gnu
      # Pre-build the desktop crate with EXACTLY the flags `bun tauri dev
      # --features e2e-testing` uses (`cargo run --no-default-features
      # --features e2e-testing`). A cold cargo build (~20 min on a fresh
      # runner) would otherwise race the 15-min Playwright test timeout inside
      # the test step; as its own step it's visible, cacheable, and the test
      # step's `cargo run` becomes a no-op rebuild.
      - name: Pre-build desktop crate (e2e-testing)
        working-directory: packages/desktop/src-tauri
        env:
          LIBRECODE_REGEN_BINDINGS: "0"
        run: cargo build --no-default-features --features e2e-testing

      - name: Run E2E — tauri mode (real webview, headless xvfb)
        working-directory: packages/app
        env:
          CI: "true"
          LIBRECODE_REGEN_BINDINGS: "0"
        # xvfb-run gives the spawned Tauri app a private headless display;
        # TauriProcessManager launches `bun tauri dev --features e2e-testing`
        # and the fixture connects over the socket. -a auto-picks a free
        # display number. --server-args is REQUIRED: xvfb-run's default screen
        # is 640x480, below the app's 768px isDesktop() breakpoint — the dock
        # doesn't render at all on a mobile-sized viewport (matches the
        # 1280x800 the local harness and Layer-2 smoke template use).
        run: xvfb-run -a --server-args="-screen 0 1280x800x24" bun run test:e2e:tauri:real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-tauri-real
          path: |
            packages/app/e2e/playwright-report-tauri-real/
            packages/app/e2e/test-results-tauri-real/
          retention-days: 7
