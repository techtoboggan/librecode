name: E2E (Tauri)
# Phase 52D — Tauri E2E tests as a required release gate.
#
# Two jobs in one workflow:
#   1. browser mode  — headless Chromium + mocked Tauri IPC (~30s, NO Cargo)
#   2. cargo compile — verifies tauri-plugin-playwright still compiles under
#                      the e2e-testing feature flag (no test run, just build)
#
# Tauri mode (real native webview via socket bridge) is commented out until
# Phase 53 wires the TauriProcessManager fixture. Browser mode is sufficient
# as a gate: it exercises 4 of 5 specs; the 5th (detach-flow) is intentionally
# skipped in browser mode because canDetach() requires a Tauri desktop context.
#
# The Playwright webServer config auto-starts the Vite dev server when
# process.env.CI is set (reuseExistingServer: false). No manual startup step
# is needed here.
#
# Security gate (ADR-010 constraint 4): verifies tauri-plugin-playwright
# is `optional = true` in Cargo.toml and NOT in the default feature list.
#
# Platform: Linux only (Phase 53 adds macOS + Windows).
# Pitfall 3: MUST use libwebkit2gtk-4.1-dev, NOT -4.0-dev (Tauri 2.x).

on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  workflow_dispatch:
    inputs:
      ref:
        required: false
        type: string
        description: "Git ref to check out (default: current)"

jobs:
  e2e-linux:
    name: E2E — Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      # ── Toolchain ─────────────────────────────────────────────────────
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: dtolnay/rust-toolchain@stable

      # ── System packages (for Cargo step; Chromium installed via Playwright) ─
      # NOTE (Pitfall 3): -4.1-dev, NOT -4.0-dev. Tauri 2.x links against 4.1.
      - name: Install Tauri system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      # ── Cargo cache (Pitfall 12 — first build is slow without cache) ───
      - name: Cache cargo registry + build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: e2e-cargo-${{ runner.os }}-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: e2e-cargo-${{ runner.os }}-

      # ── Node / npm deps ───────────────────────────────────────────────
      - run: bun install --frozen-lockfile

      - name: Install Playwright Chromium browser
        working-directory: packages/app
        run: bunx playwright install --with-deps chromium

      # ── Security gate (ADR-010 §Constraints rule 4) ───────────────────
      # Source-level check: plugin is optional = true and not in default features.
      # This verifies the production Cargo build cannot accidentally include it.
      - name: Verify tauri-plugin-playwright is optional-only
        run: |
          TOML="packages/desktop/src-tauri/Cargo.toml"
          # Rule 1: must have optional = true
          grep -A3 'tauri-plugin-playwright' "$TOML" | grep -q 'optional = true' \
            || { echo "::error::tauri-plugin-playwright missing optional = true in Cargo.toml"; exit 1; }
          # Rule 2: must NOT appear in default features
          if grep -A20 '^\[features\]' "$TOML" | grep 'default' | grep -q 'e2e-testing'; then
            echo "::error::e2e-testing in [features] default — plugin would ship in production builds"
            exit 1
          fi
          echo "Security check passed"

      # ── Browser-mode E2E (the actual gate, ~30s) ──────────────────────
      # Playwright's webServer config starts the Vite dev server automatically
      # when CI=true (reuseExistingServer: false in playwright.tauri.config.ts).
      # 4 pass + 1 skipped (detach-flow: requires platform === "desktop").
      # HARD GATE (Phase 52F). The browser-mode E2E suite is now CI-portable:
      # playwright.tauri.config.ts's webServer array starts BOTH the
      # librecode-cli backend (:4096, readiness on /config) and the Vite dev
      # server, the specs compute their session route from the repo checkout
      # path at runtime (no hardcoded home dir), and dock-toggle-cycle seeds
      # its own dock entry via a dynamic localStorage key lookup. Verified
      # against the clean reproduction locally (backend down + ports free):
      # 4 passed, 1 skipped (detach-flow, desktop-only). A failure here now
      # blocks binary builds — that's the point.
      - name: Run E2E — browser mode (HARD GATE)
        working-directory: packages/app
        run: bun run test:e2e:tauri:browser
        env:
          CI: "true"
          PLAYWRIGHT_BASE_URL: "http://127.0.0.1:3000"

      # ── Cargo compile with e2e-testing feature (HARD — Phase 53) ──────
      # Verifies the plugin compiles + the feature flag works. Phase 53
      # made this reliable on fresh CI: the e2e capability is now added at
      # RUNTIME (lib.rs setup, include_str! of e2e-testing-capability.json)
      # instead of a static capabilities/*.json. tauri_build::build() no
      # longer validates a static capability referencing playwright:default
      # — which was the fresh-runner failure (passed warm-locally, failed
      # cold-CI). Verified both ways locally: `cargo build` (production, no
      # feature) does NOT reference the plugin permission; `cargo build
      # --features e2e-testing` compiles clean. continue-on-error removed.
      # Pitfall 9: LIBRECODE_REGEN_BINDINGS=0 keeps bindings.ts from being
      # regenerated to the broken specta output format.
      # Phase 54 — the fresh-CI build panic was NOT the playwright plugin
      # (that was a red herring through v0.10.6). A -vv diagnostic surfaced
      # the swallowed panic: tauri_build::build() aborts with "resource path
      # `sidecars/librecode-cli-<triple>` doesn't exist" because tauri.conf's
      # externalBin requires the CLI sidecar to be present at build time. The
      # e2e job never staged it; local builds passed only because a real
      # sidecar lingered in sidecars/ from prior dev. Reproduced locally by
      # moving the sidecar aside (exact CI error) and fixed by staging a stub.
      #
      # A stub is sufficient here: this is a COMPILE check (cargo build, not a
      # bundle), so tauri_build only validates the externalBin path EXISTS —
      # it never executes it. Tauri-mode E2E (running the real app) needs the
      # real sidecar; that's the next step in phase-54-spec.md.
      - name: Stage stub CLI sidecar (externalBin existence check)
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          printf '#!/bin/sh\necho stub\n' > packages/desktop/src-tauri/sidecars/librecode-cli-x86_64-unknown-linux-gnu
          chmod +x packages/desktop/src-tauri/sidecars/librecode-cli-x86_64-unknown-linux-gnu

      - name: Build desktop with e2e-testing feature (compile check, HARD)
        run: |
          cd packages/desktop/src-tauri
          LIBRECODE_REGEN_BINDINGS=0 cargo build --features e2e-testing
        env:
          LIBRECODE_REGEN_BINDINGS: "0"

      # Real tauri-mode E2E now lives in the separate `tauri-real-linux`
      # job below (Phase 54) — kept non-blocking until proven stable.

      # ── Upload failure artifacts ──────────────────────────────────────
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-tauri
          path: |
            packages/app/e2e/playwright-report-tauri/
            packages/app/e2e/test-results-tauri/
          retention-days: 7

  # ── Real tauri-mode E2E (Phase 54) — NON-BLOCKING until proven ────────
  # Launches the actual app (`bun tauri dev --features e2e-testing`) under
  # xvfb on a headless runner — no real display to leak to — and drives the
  # native WebKitGTK webview via tauri-plugin-playwright's socket bridge.
  # The socket bridge was verified to work locally (headless): the
  # feature-built app opens /tmp/tauri-playwright.sock and boots its sidecar.
  #
  # continue-on-error at the JOB level: this runs on every release and
  # reports results, but a failure does NOT fail the e2e workflow (and so
  # does NOT block binary builds) while the real-app launch + socket dance
  # is being hardened. Flip to blocking once it's reliably green.
  #
  # Needs the REAL CLI sidecar (the app spawns it as its backend) — a stub
  # won't do here, unlike the compile-check above.
  tauri-real-linux:
    name: E2E — tauri mode (real webview)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Tauri system deps + xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            xvfb
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            packages/desktop/src-tauri/target
          key: e2e-tauri-cargo-${{ runner.os }}-${{ hashFiles('packages/desktop/src-tauri/Cargo.lock') }}
          restore-keys: e2e-tauri-cargo-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - name: Build real CLI sidecar
        run: bun run script/build.ts --single
        working-directory: packages/librecode
      - name: Stage CLI sidecar for Tauri externalBin
        run: |
          mkdir -p packages/desktop/src-tauri/sidecars
          # build.ts --single emits dist/librecode-linux-x64/bin/librecode
          # (same path desktop.yml's cli_src uses). Resolve it robustly in
          # case the dir name varies, then stage where externalBin expects.
          src="packages/librecode/dist/librecode-linux-x64/bin/librecode"
          if [ ! -f "$src" ]; then
            src=$(find packages/librecode/dist -path '*/bin/librecode' -type f | head -1)
          fi
          echo "sidecar src: $src"
          test -f "$src" || { echo "::error::CLI sidecar binary not found under packages/librecode/dist"; ls -R packages/librecode/dist | head -40; exit 1; }
          cp "$src" packages/desktop/src-tauri/sidecars/librecode-cli-x86_64-unknown-linux-gnu
          chmod +x packages/desktop/src-tauri/sidecars/librecode-cli-x86_64-unknown-linux-gnu
      - name: Run E2E — tauri mode (real webview, headless xvfb)
        working-directory: packages/app
        env:
          CI: "true"
          LIBRECODE_REGEN_BINDINGS: "0"
        # xvfb-run gives the spawned Tauri app a private headless display;
        # TauriProcessManager launches `bun tauri dev --features e2e-testing`
        # and the fixture connects over the socket. -a auto-picks a free
        # display number.
        run: xvfb-run -a bun run test:e2e:tauri:real
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-tauri-real
          path: |
            packages/app/e2e/playwright-report-tauri-real/
            packages/app/e2e/test-results-tauri-real/
          retention-days: 7
